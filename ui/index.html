<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音上传助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="/station-ui/_sdk.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>抖音上传助手</h1>
    <section aria-label="选择抖音账号">
      <div class="label-row"><label for="accounts">发布到哪个账号</label><span class="links"><button id="refresh" class="quiet">刷新账号</button><button id="login" class="quiet">登录新账号</button></span></div>
      <div class="account-row"><img id="avatar" alt="" hidden><select id="accounts"><option value="">还没有账号，先登录一个</option></select><button id="open" disabled>打开抖音</button></div>
      <div class="actions"><button id="prepare" class="primary" disabled>上传并填写</button></div>
    </section>
    <p class="muted">填写完成后，在抖音页面检查并发布。</p>
    <div id="status" role="status" aria-live="polite">正在读取账号…</div>
    <ul id="warnings"></ul>
  </main>
</body>
</html>
